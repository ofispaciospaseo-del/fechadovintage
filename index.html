<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fechador Digital - Acta Notarial Escribanía</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #0284c7;
      --neon-cyan: #38bdf8;
      --text-color: #f8fafc;
    }

    body {
      font-family: 'Courier New', Courier, monospace, system-ui;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.2rem;
      color: var(--neon-cyan);
      letter-spacing: 1px;
    }

    /* Reloj en vivo de referencia superior */
    .timeline-bar {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      font-family: monospace;
      margin-bottom: 16px;
    }

    .clock-live {
      font-size: 1.1rem;
      font-weight: bold;
      color: #38bdf8;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
      word-break: break-all;
    }

    .upload-zone {
      border: 2px dashed #0284c7;
      border-radius: 8px;
      padding: 24px 12px;
      text-align: center;
      margin-bottom: 20px;
      cursor: pointer;
      background: #111827;
    }

    .upload-zone p {
      margin: 0;
      font-weight: 600;
      color: #38bdf8;
    }

    input[type="file"] {
      display: none;
    }

    #hiddenCanvas {
      display: none;
    }

    .result-section {
      display: none;
      text-align: center;
      margin-top: 15px;
    }

    .result-img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .download-link {
      display: block;
      width: 100%;
      background: #0284c7;
      color: white;
      text-decoration: none;
      padding: 14px 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }

    .download-link:active {
      background: #0369a1;
    }

    .hint-text {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>FECHADOR DIGITAL NOTARIAL</h1>

  <!-- Reloj continuo de referencia -->
  <div class="timeline-bar">
    <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px;">HORA OFICIAL PROVINCIA DE BS. AS. (ART / UTC-3)</div>
    <div class="clock-live" id="liveClock">00/00/0000 00:00:00.000 ART</div>
  </div>

  <!-- Zona de carga -->
  <div class="upload-zone" onclick="document.getElementById('imgInput').click()">
    <p>📜 INGRESAR DOCUMENTO O TOMAR FOTO</p>
    <input type="file" id="imgInput" accept="image/*" onchange="handleFileSelect(this.files[0])">
  </div>

  <canvas id="hiddenCanvas"></canvas>

  <!-- Resultado con estampa totalmente integrada estilo Escribanía -->
  <div class="result-section" id="resultSection">
    <p style="text-align: left; margin-bottom: 8px; font-weight: bold; color: #cbd5e1;">Acta Estampada (Escribanía & Neón):</p>
    <img id="finalImage" class="result-img" alt="Imagen estampada escribania">
    
    <a id="downloadBtn" class="download-link" href="#" download="acta_escribania_fechada.png">📥 DESCARGAR ACTA NOTARIAL (PNG)</a>
    <p class="hint-text">(O mantén presionada la imagen para guardarla en el celular)</p>
  </div>
</div>

<script>
  // Hora oficial de Buenos Aires con milisegundos
  function getArgentinaFormattedTime(dateObj = new Date()) {
    const ms = String(dateObj.getMilliseconds()).padStart(3, '0');
    
    const options = {
      timeZone: 'America/Argentina/Buenos_Aires',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    };

    const formatter = new Intl.DateTimeFormat('es-AR', options);
    const parts = Object.fromEntries(formatter.formatToParts(dateObj).map(p => [p.type, p.value]));

    const dateStr = `${parts.day}/${parts.month}/${parts.year}`;
    const timeStr = `${parts.hour}:${parts.minute}:${parts.second}.${ms}`;

    return {
      full: `${dateStr} ${timeStr} ART (UTC-3)`,
      dateOnly: dateStr,
      timeOnlyMs: timeStr,
      stampTime: `${parts.hour}:${parts.minute}:${parts.second}.${ms}`
    };
  }

  // Reloj continuo de la cabecera
  function updateLiveClock() {
    const timeData = getArgentinaFormattedTime();
    document.getElementById('liveClock').textContent = timeData.full;
    requestAnimationFrame(updateLiveClock);
  }
  requestAnimationFrame(updateLiveClock);

  function handleFileSelect(file) {
    if (!file) return;

    const timeData = getArgentinaFormattedTime(new Date());
    
    const sizeInKB = (file.size / 1024).toFixed(2);
    const sizeInMB = (file.size / (1024 * 1024)).toFixed(2);
    const sizeStr = file.size > 1048576 ? `${sizeInMB} MB (${file.size} bytes)` : `${sizeInKB} KB (${file.size} bytes)`;

    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const geoStr = `Lat: ${pos.coords.latitude.toFixed(6)}, Lon: ${pos.coords.longitude.toFixed(6)} (±${pos.coords.accuracy.toFixed(1)}m)`;
          generateNotaryStamp(file, timeData, sizeStr, geoStr);
        },
        () => {
          generateNotaryStamp(file, timeData, sizeStr, "GEO: No permitida");
        },
        { enableHighAccuracy: true, timeout: 5000 }
      );
    } else {
      generateNotaryStamp(file, timeData, sizeStr, "GEO: No soportada");
    }
  }

  function generateNotaryStamp(file, timeData, sizeStr, geoStr) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.getElementById('hiddenCanvas');
        const ctx = canvas.getContext('2d');

        const imgWidth = img.width;
        const imgHeight = img.height;

        canvas.width = imgWidth;
        canvas.height = imgHeight;

        // 1. DIBUJAR LA FOTO ORIGINAL
        ctx.drawImage(img, 0, 0, imgWidth, imgHeight);

        // 2. FAJA DE ACTA NOTARIAL INFERIOR (Textura tipo cinta/pergamino oscuro)
        const bannerHeight = Math.max(130, Math.round(imgHeight * 0.22));
        const bannerY = imgHeight - bannerHeight;

        // Tinta azul oscuro de registro notarial
        ctx.fillStyle = 'rgba(10, 18, 38, 0.92)';
        ctx.fillRect(0, bannerY, imgWidth, bannerHeight);

        // Guía superior neón resplandeciente
        ctx.shadowColor = '#00d8ff';
        ctx.shadowBlur = 10;
        ctx.strokeStyle = '#00d8ff';
        ctx.lineWidth = Math.max(3, Math.round(imgWidth * 0.004));
        ctx.beginPath();
        ctx.moveTo(0, bannerY);
        ctx.lineTo(imgWidth, bannerY);
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Datos tipográficos estilo máquina de escribir
        const fontSizeTitle = Math.max(13, Math.round(imgWidth * 0.024));
        const fontSizeData = Math.max(11, Math.round(imgWidth * 0.019));
        const marginX = Math.round(imgWidth * 0.03);

        ctx.fillStyle = '#00d8ff';
        ctx.font = `bold ${fontSizeTitle}px "Courier New", Courier, monospace`;
        ctx.fillText('ACTA NOTARIAL DE FE CIERTA & REGISTRO DIGITAL', marginX, bannerY + (bannerHeight * 0.22));

        ctx.fillStyle = '#e2e8f0';
        ctx.font = `${fontSizeData}px "Courier New", Courier, monospace`;
        ctx.fillText(`HORA/FECHA OFICIAL: ${timeData.full}`, marginX, bannerY + (bannerHeight * 0.45));
        ctx.fillText(`DOCUMENTO TAMAÑO : ${sizeStr} [${file.name.substring(0, 25)}]`, marginX, bannerY + (bannerHeight * 0.67));
        ctx.fillText(`COORDENADAS GEO   : ${geoStr}`, marginX, bannerY + (bannerHeight * 0.88));

        // 3. SELLO RECTANGULAR DE ESCRIBANÍA "RECIÉN ENTINTADO"
        const stampW = Math.max(220, Math.round(imgWidth * 0.38));
        const stampH = Math.max(120, Math.round(stampW * 0.54));
        const stampX = imgWidth - stampW - Math.round(imgWidth * 0.03);
        const stampY = Math.round(imgHeight * 0.03);

        ctx.save();
        ctx.translate(stampX + (stampW / 2), stampY + (stampH / 2));
        ctx.rotate(-4 * Math.PI / 180); // Inclinación manual de estampa

        // Fondo de tinta húmeda (azul de metileno semitransparente)
        ctx.fillStyle = 'rgba(15, 30, 65, 0.88)';
        ctx.fillRect(-stampW/2, -stampH/2, stampW, stampH);

        // EFECTO TINTA FRESCA / DESGASTE DE GOMA EN BORDES
        ctx.strokeStyle = '#1e40af';
        ctx.lineWidth = Math.max(4, Math.round(stampH * 0.04));
        ctx.strokeRect(-stampW/2, -stampH/2, stampW, stampH);

        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 1.5;
        ctx.strokeRect((-stampW/2) + 5, (-stampH/2) + 5, stampW - 10, stampH - 10);

        // Porosidad/Salpicaduras de tinta de almohadilla recién entintada
        ctx.fillStyle = 'rgba(30, 64, 175, 0.3)';
        for (let i = 0; i < 15; i++) {
          let rx = (Math.random() - 0.5) * stampW;
          let ry = (Math.random() - 0.5) * stampH;
          let rsize = Math.random() * 4 + 1;
          ctx.beginPath();
          ctx.arc(rx, ry, rsize, 0, Math.PI * 2);
          ctx.fill();
        }

        const fontHeader = Math.max(9, Math.round(stampH * 0.11));
        const fontNeonTime = Math.max(11, Math.round(stampH * 0.15));
        const fontSub = Math.max(8, Math.round(stampH * 0.085));

        // Textos del sello escribanía
        ctx.fillStyle = '#93c5fd';
        ctx.textAlign = 'center';
        ctx.font = `bold ${fontHeader}px "Courier New", Courier, monospace`;
        ctx.fillText('ESCRIBANÍA DE FE CIERTA', 0, -stampH * 0.28);

        ctx.font = `${fontSub}px "Courier New", Courier, monospace`;
        ctx.fillText(`REGISTRO DE FECHA: ${timeData.dateOnly}`, 0, -stampH * 0.10);

        // MILISEGUNDOS Y HORA CON BRICE DE NEÓN CYAN SOBRE LA TINTA
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 14;
        ctx.fillStyle = '#00f0ff';
        ctx.font = `bold ${fontNeonTime}px "Courier New", Courier, monospace`;
        ctx.fillText(timeData.stampTime, 0, stampH * 0.18);
        ctx.shadowBlur = 0;

        // Pie de acta oficial
        ctx.fillStyle = '#bfdbfe';
        ctx.font = `bold ${fontSub}px "Courier New", Courier, monospace`;
        ctx.fillText('PROVINCIA DE BS. AS. • ART', 0, stampH * 0.38);

        ctx.restore();

        // 4. GENERAR IMAGEN FINAL
        const dataUrl = canvas.toDataURL('image/png');
        
        const finalImg = document.getElementById('finalImage');
        finalImg.src = dataUrl;

        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.href = dataUrl;
        downloadBtn.download = `Acta_Notarial_Fechada_${Date.now()}.png`;

        document.getElementById('resultSection').style.display = 'block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
</script>

</body>
</html>
